general {
	lock_cmd = pidof hyprlock || hyprlock          # D-Bus lock events; guard against stacking instances
	before_sleep_cmd = pidof hyprlock || hyprlock  # lock before suspending
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # avoid needing two keypresses to wake
}

listener {
    timeout = 600                             # 10min
    on-timeout = pidof hyprlock || hyprlock   # lock screen when timeout has passed
    # on-resume = notify-send "Welcome back!" # command to run when activity is detected after timeout has fired.
}

listener {
    timeout = 900                           # 15min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'  # command to run when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # command to run when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                          # 30min
    on-timeout = systemctl suspend          # suspend the machine
}
