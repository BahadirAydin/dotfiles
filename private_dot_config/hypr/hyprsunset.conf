## BLUE LIGHT FILTER ##
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# Profiles are applied by wall-clock time: at each `time` the listed values are
# set and stay until the next profile comes round. The last profile of the day
# carries over past midnight, so 23:00 holds until 07:00.
#
# A manual override (the waybar click, or SUPER+T) wins until the next profile
# boundary, at which point the schedule takes back over.

profile {
    time = 07:30
    temperature = 6500
}

profile {
    time = 19:30
    temperature = 5set -Ux JAVA_HOME /usr/lib/jvm/java-26-openjdk500
}

profile {
    time = 23:00
    temperature = 4500
}
