[Settings]
# libadwaita apps take their light/dark cue from the color-scheme gsettings
# key, not from here -- see the run_onchange script that sets it. These are
# the settings GTK4 still reads from disk.
gtk-icon-theme-name=Papirus-Dark

gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=28

gtk-font-name=Adwaita Sans 11
