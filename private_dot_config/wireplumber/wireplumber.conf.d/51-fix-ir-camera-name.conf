# The ASUS ZenBook UX434FL webcam reports the same V4L2 card name,
# "USB2.0 HD IR UVC WebCam", for BOTH its colour node (/dev/video0) and its
# infrared node (/dev/video2). GNOME Snapshot's aperture library filters out
# cameras whose name looks infrared, so the "IR" in the shared name made it
# discard the colour camera too, leaving "No camera found".
#
# Rename only the colour node (USB interface .0) so it no longer trips that
# heuristic. The IR node (.2) deliberately keeps its original name so it
# continues to be filtered out.
monitor.v4l2.rules = [
  {
    matches = [
      { node.name = "v4l2_input.pci-0000_00_14.0-usb-0_5_1.0" }
    ]
    actions = {
      update-props = {
        node.nick        = "Integrated Webcam"
        node.description = "Integrated Webcam"
      }
    }
  }
]
