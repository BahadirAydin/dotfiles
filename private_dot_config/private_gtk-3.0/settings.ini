[Settings]
# GTK3 has no notion of the org.gnome.desktop.interface color-scheme key that
# libadwaita reads, so the dark preference has to be stated here as well.
# Between the two, every toolkit app on the desktop starts dark instead of
# opening a white rectangle over the blur.
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita

# Papirus-Dark is already what rofi and dunst draw with, so an app's icon in
# the launcher and the same icon inside the app now come from one set.
gtk-icon-theme-name=Papirus-Dark

gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24

gtk-font-name=Adwaita Sans 11
