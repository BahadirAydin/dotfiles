## name: Catppuccin Mocha
## upstream: https://catppuccin.com/palette
## Matches hypr, waybar, nvim and yazi, which are all on Mocha.

foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #1E1E2E

url_color               #89B4FA

active_border_color     #CBA6F7
