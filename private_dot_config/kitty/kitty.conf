font_size 13.0

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

modify_font cell_height 105%

# vertical horizontal -- clears hyprland's rounding=10 corner radius
window_padding_width 4 8

# window decorations
hide_window_decorations yes

# SCROLLBACK

scrollback_lines 20000
# Extra MB kept for the pager only (ctrl+shift+h); not interactively scrollable.
scrollback_pager_history_size 64

# Needs shell integration. Second arg is the minimum command duration in seconds.
notify_on_cmd_finish unfocused 10

# TABS

tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol 󱥸 
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"
tab_title_max_length 0

# KEYBINDINGS

map ctrl+shift+i change_font_size all +1.0

map ctrl+shift+enter launch --cwd=current

map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard

map ctrl+shift+up scroll_line_up smooth
map --allow-fallback=shifted,ascii ctrl+shift+k scroll_line_up smooth
map ctrl+shift+page_up scroll_page_up

map ctrl+shift+down scroll_line_down smooth
map --allow-fallback=shifted,ascii ctrl+shift+j scroll_line_down smooth
map ctrl+shift+page_down scroll_page_down

map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

map --allow-fallback=shifted,ascii ctrl+shift+z scroll_to_prompt -1
map --allow-fallback=shifted,ascii ctrl+shift+x scroll_to_prompt 1

map --allow-fallback=shifted,ascii ctrl+shift+g show_last_command_output

# CURSOR
cursor_blink_interval 0

# TERMINAL BELL
enable_audio_bell yes
visual_bell_duration 0.3
visual_bell_color #9d81ba
bell_on_tab "🔔 "

# LIGATURES 
disable_ligatures cursor

# CURSOR SHAPE
cursor_shape beam

# Switch themes by changing this one line back to rosepine.conf
include catppuccin-mocha.conf


